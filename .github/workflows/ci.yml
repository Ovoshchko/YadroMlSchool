name: Project Ci

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:

    - name: Install dependencies
      run: |
        ls -R
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Run tests
      working-directory: Python/Project
      run: |
        python -m unittest discover -s src/tests -p "*.py"
  static_analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run flake8
      run: |
        flake8 . --max-line-length=120


