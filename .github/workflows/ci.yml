name: Project Ci

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!main'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Python/Project/src/requirements.txt

    - name: Run tests
      run: |
        pwd 
        ls -R
        python -m unittest discover -s Python/Project/src/tests -p "*.py"
  static_analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run flake8
      run: |
        flake8 ./Python/Project --max-line-length=120


